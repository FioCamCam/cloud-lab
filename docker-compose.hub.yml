services:

  backend:
    image: fiocamcam/mern-backend:1.0
    container_name: mern-backend
    network_mode: host
    environment:
      MONGODB_URI: ${MONGODB_URI}
      PORT: 5000
    

  frontend:
    image: fiocamcam/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
