services:
  backend:
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env

  frontend:
    build:
      context: ./mern-demo/client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend